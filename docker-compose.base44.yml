name: gym-erp

services:
  db:
    image: postgres:16-alpine
    restart: on-failure
    environment:
      POSTGRES_USER: gym
      POSTGRES_PASSWORD: gym_dev_password
      POSTGRES_DB: gym_erp
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gym -d gym_erp"]
      interval: 5s
      timeout: 3s
      retries: 24

  # One-shot: installs deps, generates + applies migrations, seeds the demo tenant.
  setup:
    image: node:22-bookworm-slim
    working_dir: /workspace
    volumes:
      - "${BASE44_PROJECT_ROOT}:/workspace"
    environment:
      DATABASE_URL: postgres://gym:gym_dev_password@db:5432/gym_erp
      BETTER_AUTH_URL: https://3000-${BASE44_PUBLIC_HOST_SUFFIX}
    env_file:
      - ./.env.base44-defaults
      - /run/base44/app.env
    command:
      [
        "sh",
        "-ec",
        "npm install --no-audit --no-fund && npm run db:generate -w server && npm run db:migrate -w server && npm run db:seed -w server",
      ]
    depends_on:
      db:
        condition: service_healthy

  app:
    image: node:22-bookworm-slim
    working_dir: /workspace
    restart: on-failure
    volumes:
      - "${BASE44_PROJECT_ROOT}:/workspace"
    ports:
      - "3000:3000"
      - "8000:8000"
    environment:
      DATABASE_URL: postgres://gym:gym_dev_password@db:5432/gym_erp
      BETTER_AUTH_URL: https://3000-${BASE44_PUBLIC_HOST_SUFFIX}
      BASE44_PREVIEW_MODE: ${BASE44_PREVIEW_MODE:-}
      BASE44_PUBLIC_HOST_SUFFIX: ${BASE44_PUBLIC_HOST_SUFFIX:-}
      BASE44_SANDBOX_HOST_DOMAIN: ${BASE44_SANDBOX_HOST_DOMAIN:-}
      CHOKIDAR_USEPOLLING: "1"
    env_file:
      - ./.env.base44-defaults
      - /run/base44/app.env
    command: ["sh", "-ec", "npm install --no-audit --no-fund && exec npm run dev"]
    depends_on:
      setup:
        condition: service_completed_successfully
    labels:
      base44.project: "Gym ERP"
      base44.kind: "web"
      base44.port: "3000"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e 'Promise.all([fetch(\"http://127.0.0.1:3000/\"),fetch(\"http://127.0.0.1:8000/api/v1/health\")]).then(r=>process.exit(r.every(x=>x.ok)?0:1)).catch(()=>process.exit(1))'",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 90s

volumes:
  db-data:
